name: Build OMPTCProuter for BPi-R4

on:
  push:
    branches: [master, main, develop]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target device'
        required: true
        default: 'bpi-r4'
        type: choice
        options:
          - bpi-r4
          - bpi-r4-poe
      kernel:
        description: 'Kernel version'
        required: true
        default: '6.12'
        type: choice
        options:
          - '6.12'
          - '6.18'

env:
  REPO_URL: 'https://github.com/ysurac/openmptcprouter'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        OMR_TARGET: [bpi-r4]
        OMR_KERNEL: [6.12, 6.18]
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 gcc-multilib libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx-ucl libelf-dev autoconf automake libtool autopoint device-tree-compiler python3-docutils rsync wget curl file

    - name: Free disk space
      run: |
        sudo swapoff -a >/dev/null 2>&1 || true
        sudo rm -f /swapfile >/dev/null 2>&1 || true
        sudo apt-get autoremove -y >/dev/null 2>&1 || true
        sudo apt-get autoclean -y >/dev/null 2>&1 || true
        sudo rm -rf /usr/local/share/boost >/dev/null 2>&1 || true
        sudo rm -rf "$AGENT_TOOLSDIRECTORY" >/dev/null 2>&1 || true
        sudo rm -rf /usr/share/dotnet >/dev/null 2>&1 || true
        sudo rm -rf /opt/ghc >/dev/null 2>&1 || true
        df -h

    - name: Build toolchain
      env:
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
        OMR_FEED_SRC: ${{ github.ref_name }}
      run: |
        OMR_KERNEL="${OMR_KERNEL}" OMR_FEED_SRC="${OMR_FEED_SRC}" sh build.sh prepare {tools,toolchain}/install -j$(nproc) || \
        OMR_KERNEL="${OMR_KERNEL}" OMR_FEED_SRC="${OMR_FEED_SRC}" sh build.sh prepare {tools,toolchain}/install -j1 V=s

    - name: Apply minimal profile (strip bloat)
      env:
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
      run: |
        CFG="$OMR_TARGET/$OMR_KERNEL/source/.config"
        echo "=== Original package count ==="
        grep -c 'CONFIG_PACKAGE.*=y\|=m' "$CFG" || true
        
        # Remove the bloated full package
        sed -i '/CONFIG_PACKAGE_openmptcprouter-full=y/d' "$CFG"
        
        # Remove only VPN/encryption/tunnel bloat
        for pkg in v2ray xray shadowsocks openvpn wireguard glorytun mlvpn dsvpn softether mqvpn; do
          sed -i "/CONFIG_PACKAGE_.*${pkg}.*=y\|=m/d" "$CFG" 2>/dev/null || true
        done
        
        # Keep ALL network infrastructure services:
        # sqm(QoS), smartdns, ddns, wol, upnp, bpftune, banudpip, irqbalance, vnstat
        
        # Remove extra LuCI themes (keep only bootstrap)
        for pkg in argon alpha design material openwrt-2020; do
          sed -i "/CONFIG_PACKAGE_luci-theme-${pkg}.*=y\|=m/d" "$CFG" 2>/dev/null || true
        done
        
        # Remove non-networking heavy tools (keep all network monitoring)
        for pkg in mc nano htop; do
          sed -i "/CONFIG_PACKAGE_.*${pkg}.*=y\|=m/d" "$CFG" 2>/dev/null || true
        done
        
        # Keep ALL USB network drivers (USB Ethernet adapters)
        # Keep ALL USB serial / modem drivers (4G/5G communication modules)
        # No kmod stripping - network & comm drivers stay untouched
        
        # Keep speedtestcpp for bandwidth testing
        echo 'CONFIG_PACKAGE_speedtestcpp=y' >> "$CFG" 2>/dev/null || true
        
        echo "=== After stripping ==="
        grep -c 'CONFIG_PACKAGE.*=y\|=m' "$CFG" || true
        
        # Ensure MPTCP core + BPF schedulers are enabled
        echo 'CONFIG_PACKAGE_mptcp=y' >> "$CFG"
        echo 'CONFIG_PACKAGE_luci-app-mptcp=y' >> "$CFG"
        for bpfpkg in mptcp-bpf-minrtt mptcp-bpf-burst mptcp-bpf-rr mptcp-bpf-bkup mptcp-bpf-first mptcp-bpf-red bpftool-full; do
          echo "CONFIG_PACKAGE_${bpfpkg}=y" >> "$CFG"
        done
        
        # Re-run defconfig to resolve dependencies
        make -C "$OMR_TARGET/$OMR_KERNEL/source" defconfig

    - name: Embed system optimization defaults into firmware
      env:
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
      run: |
        FILES_DIR="$OMR_TARGET/$OMR_KERNEL/source/files"
        mkdir -p "$FILES_DIR/etc/sysctl.d"
        mkdir -p "$FILES_DIR/etc/uci-defaults"
        mkdir -p "$FILES_DIR/root"

        # === 1. Kernel sysctl tuning for optimal 4G/5G aggregation ===
        cat > "$FILES_DIR/etc/sysctl.d/11-omr-optimization.conf" << 'SYSCONF'
# OpenMPTCProuter optimization for 4G/5G multi-WAN aggregation
# Applied at boot time

# --- Congestion control: BBR2 is best for cellular ---
net.ipv4.tcp_congestion_control = bbr2
# Use fq qdisc for fair queuing (required for BBR)
net.core.default_qdisc = fq

# --- TCP performance tuning ---
# Don't reset cwnd after idle period
net.ipv4.tcp_slow_start_after_idle = 0
# Enable MTU probing to avoid PMTU black holes
net.ipv4.tcp_mtu_probing = 1
# Increase TCP buffer autotuning limits
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 1800
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3
SYSCONF

        # === 2. First-boot UCI defaults (runs once after flashing) ===
        cat > "$FILES_DIR/etc/uci-defaults/99-omr-optimization" << 'UCIBOOT'
#!/bin/sh
# OpenMPTCProuter first-boot optimization
# Runs once after flashing, then self-deletes

sleep 3

# Set default MPTCP scheduler to minrtt (best for heterogeneous 5G)
sysctl -w net.mptcp.scheduler="minrtt" 2>/dev/null || true

# Enable TCP Low Latency mode + dynamic master selection
if uci get openmptcprouter.advanced.tcp_low_latency >/dev/null 2>&1; then
  uci set openmptcprouter.advanced.tcp_low_latency='1'
  uci set openmptcprouter.advanced.master_dynamic='1'
  uci commit openmptcprouter
fi

# Enable flow offloading for faster forwarding
if uci get firewall.@defaults[0].flow_offloading >/dev/null 2>&1; then
  uci set firewall.@defaults[0].flow_offloading='1'
  uci commit firewall
fi

exit 0
UCIBOOT
        chmod +x "$FILES_DIR/etc/uci-defaults/99-omr-optimization"

        # === 3. On-router test script ===
        cat > "$FILES_DIR/root/omr-test.sh" << 'TESTSCRIPT'
#!/bin/sh
# OMR post-install test suite. Run: sh /root/omr-test.sh

PASS=0; FAIL=0
pass() { echo "[PASS] $1"; PASS=$((PASS+1)); }
fail() { echo "[FAIL] $1"; FAIL=$((FAIL+1)); }
info() { echo "[INFO] $1"; }

echo "=== OMR Test Suite ==="

# 1. System
uname -a && pass "Kernel" || fail "Kernel"

# 2. MPTCP
if [ -f /proc/sys/net/mptcp/enabled ]; then
  [ "$(cat /proc/sys/net/mptcp/enabled)" = "1" ] && pass "MPTCP enabled" || fail "MPTCP disabled"
  info "Scheduler: $(cat /proc/sys/net/mptcp/scheduler 2>/dev/null || echo N/A)"
  info "Congestion: $(sysctl -n net.ipv4.tcp_congestion_control 2>/dev/null)"
else
  fail "No MPTCP sysfs"
fi

# 3. Connectivity
ping -c 2 -W 3 8.8.8.8 >/dev/null 2>&1 && pass "Internet" || fail "No internet"
host -W 3 www.baidu.com >/dev/null 2>&1 && pass "DNS" || info "DNS check"

# 4. BPF schedulers
for sched in minrtt burst rr; do
  ls /sys/fs/bpf/mptcp/scheds/$sched 2>/dev/null && pass "BPF $sched" || info "BPF $sched not loaded"
done

echo "=== $PASS passed, $FAIL failed ==="
TESTSCRIPT
        chmod +x "$FILES_DIR/root/omr-test.sh"

        echo "=== Embedded optimization files ==="
        find "$FILES_DIR" -type f

    - name: Build packages
      env:
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
      run: |
        make IGNORE_ERRORS=m -C $OMR_TARGET/$OMR_KERNEL/source package/{compile,install,index} -j$(nproc) || \
        make IGNORE_ERRORS=m -C $OMR_TARGET/$OMR_KERNEL/source package/{compile,install,index} -j1 V=s

    - name: Build firmware image
      env:
        OMR_TARGET: ${{ matrix.OMR_TARGET }}
        OMR_KERNEL: ${{ matrix.OMR_KERNEL }}
      run: |
        make IGNORE_ERRORS=m -C $OMR_TARGET/$OMR_KERNEL/source target/install -j$(nproc) || \
        make IGNORE_ERRORS=m -C $OMR_TARGET/$OMR_KERNEL/source target/install -j1 V=s

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-${{ matrix.OMR_TARGET }}-kernel${{ matrix.OMR_KERNEL }}
        path: ${{ matrix.OMR_TARGET }}/${{ matrix.OMR_KERNEL }}/source/bin
        overwrite: true
